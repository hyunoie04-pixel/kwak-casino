<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b15">
<title>곽회장의 카지노</title>
<style>
/* 색상을 변경하려면 아래 변수를 수정하세요. */
:root{--gold:#f3cc70;--text:#f8f4e9;--muted:#a4b8ac}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;padding:32px 18px;background:radial-gradient(ellipse at 50% 0%,#17432e,transparent 65%),#06130f;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe7a6;outline-offset:5px}[hidden]{display:none!important}.app{max-width:900px;margin:auto}header{text-align:center;margin-bottom:32px}.brand{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:5px}.brand:before,.brand:after{content:'✦';margin:0 12px}h1{margin:16px 0 10px;font-size:clamp(32px,7vw,58px);letter-spacing:-2px;color:#ffe7a6;text-shadow:0 0 24px #e9b84f55,0 3px 0 #624922}.tagline{color:var(--muted);font-size:13px}.panel{padding:clamp(24px,5vw,48px);border:1px solid #f3cc7045;border-radius:26px;background:linear-gradient(145deg,#163328,#10271f);box-shadow:0 24px 70px #0006,inset 0 0 0 6px #ffffff02}.center{text-align:center}.suits{color:var(--gold);font-size:35px;letter-spacing:16px;margin-bottom:24px}h2{font-size:clamp(26px,5vw,38px);margin:0 0 16px;letter-spacing:-1px}.description{color:var(--muted);line-height:1.8;margin-bottom:30px}.primary{min-height:56px;padding:16px 36px;border:1px solid #ffe7a6;border-radius:14px;background:linear-gradient(135deg,#ffe7a6,#d9a741);color:#281d07;font-weight:900;transition:transform .18s,box-shadow .18s}.primary:hover{transform:translateY(-3px);box-shadow:0 9px 28px #d9a74140}.primary:active{transform:scale(.97)}.note{color:var(--muted);font-size:12px;margin-top:24px}.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:12px;letter-spacing:2px}.counter{font-size:18px;font-weight:800;color:#ffe7a6}.track{height:5px;border-radius:10px;background:#0005;overflow:hidden;margin-bottom:34px}.fill{height:100%;width:0;background:linear-gradient(90deg,#bd903b,#ffe7a6);transition:width .3s}.question-card{transition:opacity .16s,transform .16s}.leaving{opacity:0;transform:translateY(-10px)}.entering{opacity:0;transform:translateY(12px)}.question{text-align:center;font-size:clamp(23px,4.5vw,34px);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;margin-bottom:32px}.choices{display:grid;grid-template-columns:1fr 48px 1fr;align-items:center;gap:12px}.choice{width:100%;min-height:165px;padding:28px 18px;border:1px solid #f3cc7050;border-radius:20px;color:var(--text);background:linear-gradient(145deg,#234737,#112b20);font-size:clamp(22px,3vw,30px);font-weight:800;word-break:keep-all;overflow-wrap:anywhere;transition:transform .18s,border-color .18s,opacity .18s,box-shadow .18s}.choice:hover:not(:disabled){transform:translateY(-5px);border-color:var(--gold);box-shadow:0 10px 28px #0004}.choice.selected{border-color:#ffe7a6;background:linear-gradient(145deg,#695322,#39341c);box-shadow:0 0 30px #f3cc7030;animation:pick .32s both}.choice.unselected{opacity:.35}.choice:disabled{cursor:default}.number,.vs{color:var(--gold)}.vs{text-align:center;font-size:18px;font-weight:900;font-style:italic}.feedback{min-height:28px;text-align:center;margin:26px 0 0;color:#ffe7a6;font-size:14px}.results{display:grid;gap:12px;margin:28px 0}.result{padding:20px;border:1px solid #f3cc702b;border-radius:16px;background:#06170f66;animation:reveal .3s both}.round{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:2px}.result h3{font-size:16px;line-height:1.6;overflow-wrap:anywhere}.selected-text{display:inline-block;padding:8px 12px;background:#f3cc7012;border-radius:9px;color:#ffe7a6;font-size:14px;font-weight:700}.detail{color:var(--muted);font-size:13px;line-height:1.6}footer{text-align:center;color:#82998b;font-size:11px;line-height:1.8;margin-top:24px}@keyframes pick{0%{transform:scale(1)}55%{transform:scale(1.045)}100%{transform:scale(1.02)}}@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:580px){body{padding:24px 14px}.choices{grid-template-columns:1fr}.choice{min-height:105px;padding:24px 18px}.vs{font-size:15px}.primary{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand">KWAK CASINO</div><h1>곽회장의 카지노</h1><p class="tagline">운보다 중요한 건… 당신의 취향.</p></header>
<!-- 시작 화면 -->
<section id="start" class="panel center"><div class="suits" aria-hidden="true">♠ ♥ ♣ ♦</div><h2>당신의 선택은?</h2><p class="description">두 가지 선택, 단 한 번의 클릭.<br>곽회장님이 당신의 선택을 기다립니다.</p><button id="start-button" class="primary" type="button">게임 시작 →</button><p id="note" class="note"></p></section>
<!-- 문제 화면 -->
<section id="game" class="panel" hidden><div class="progress-top"><span>오늘의 선택</span><span id="counter" class="counter"></span></div><div id="progress" class="track" role="progressbar" aria-label="완료한 문제" aria-valuemin="0" aria-valuenow="0"><div id="fill" class="fill"></div></div><div id="card" class="question-card"><h2 id="question" class="question" tabindex="-1"></h2><div class="choices"><button id="choice-0" class="choice" type="button"></button><div class="vs" aria-hidden="true">VS</div><button id="choice-1" class="choice" type="button"></button></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p></div></section>
<!-- 결과 화면 -->
<section id="end" class="panel" hidden><div class="center"><div class="suits" aria-hidden="true">♠ ♦ ♣ ♥</div><h2 id="end-title" tabindex="-1">게임 종료!</h2><p id="summary" class="description"></p></div><div id="results" class="results"></div><div class="center"><button id="restart" class="primary" type="button">다시 하기 ↻</button></div></section>
<footer>실제 돈이나 베팅 없이 즐기는 재미용 퀴즈 · 밸런스 게임입니다.</footer>
</main>
<script>
// 문제를 추가하면 자동으로 게임에 포함됩니다. choices에는 두 선택지를 넣으세요.
// 정답이 있다면 correctIndex: 0(첫 선택지) 또는 1(두 번째)을 추가하세요.
// 선택별 결과 문구는 resultTexts: ["첫 선택 결과", "두 번째 선택 결과"]로 수정합니다.
const questions = [
  {
    question: "김수민이랑 김현이 둘 중에 누가 더 키가 클까요?",
    choices: ["김현이", "김수민"]
    // 실제 정답 확인 후 correctIndex: 0 또는 1을 추가하세요.
  },
  {
    question: "평생 하나만 공짜라면, 당신의 선택은?",
    choices: ["치킨 무한 제공", "커피 무한 제공"],
    resultTexts: ["곽회장님이 치킨집 명예 VIP로 임명했습니다.", "당신의 혈관에 아메리카노가 흐르기 시작합니다."]
  },
  {
    question: "월요일 아침, 더 탐나는 초능력은?",
    choices: ["순간이동으로 출근", "시간을 멈추고 꿀잠"],
    resultTexts: ["출근 1초 컷. 그런데 퇴근은 언제죠?", "알람 시계가 당신에게 패배를 선언했습니다."]
  },
  {
    question: "곽회장님의 비밀 금고에서 나온 것은?",
    choices: ["황금빛 붕어빵", "전설의 검은 카드"],
    resultTexts: ["겉바속촉까지 금수저인 붕어빵을 획득했습니다.", "카드 뒷면에 적혀 있습니다. ‘회장님 단골 도장 카드’"]
  },
  {
    question: "친구들과의 약속, 당신은 어느 쪽?",
    choices: ["30분 일찍 도착", "딱 맞춰 극적 등장"],
    resultTexts: ["당신은 이미 메뉴와 자리 배치까지 끝냈습니다.", "문이 열리고 주인공이 등장합니다. 바로 당신."]
  }
];

// 화면 요소와 게임 진행 상태
const $ = id => document.getElementById(id);
const buttons = [$("choice-0"), $("choice-1")];
let currentIndex = 0;
let answers = [];
let locked = false;
$("note").textContent = `총 ${questions.length}문제 · 참가비 0원 · 고민은 자유`;
function showScreen(id) {
  ["start", "game", "end"].forEach(name => $(name).hidden = name !== id);
}
function startGame() {
  currentIndex = 0;
  answers = [];
  locked = false;
  if (!questions.length) { showResults(); return; }
  showScreen("game");
  renderQuestion();
}
// 현재 문제 표시 및 버튼 상태 초기화
function renderQuestion() {
  const item = questions[currentIndex];
  $("card").classList.remove("leaving", "entering");
  $("question").textContent = item.question;
  $("counter").textContent = `${currentIndex + 1} / ${questions.length}`;
  $("progress").setAttribute("aria-valuemax", questions.length);
  updateProgress();
  $("feedback").textContent = "마음이 가는 쪽을 골라주세요.";
  buttons.forEach((button, index) => {
    button.disabled = false;
    button.classList.remove("selected", "unselected");
    const number = document.createElement("span");
    number.className = "number";
    number.textContent = `${index + 1}. `;
    button.replaceChildren(number, document.createTextNode(item.choices[index]));
  });
  locked = false;
  $("question").focus({preventScroll: true});
}
function updateProgress() {
  $("progress").setAttribute("aria-valuenow", answers.length);
  $("fill").style.width = `${answers.length / questions.length * 100}%`;
}
// 중복 클릭을 막고 선택 저장 후 0.5초 뒤 이동합니다.
function selectChoice(choiceIndex) {
  if (locked) return;
  locked = true;
  const item = questions[currentIndex];
  answers.push({questionIndex: currentIndex, choiceIndex});
  buttons.forEach((button, index) => {
    button.disabled = true;
    button.classList.add(index === choiceIndex ? "selected" : "unselected");
  });
  const hasAnswer = item.correctIndex === 0 || item.correctIndex === 1;
  $("feedback").textContent = hasAnswer
    ? (choiceIndex === item.correctIndex ? "정답! 멋진 선택입니다. ✦" : "아쉽네요! 다음 문제로 갑니다. ✦")
    : "선택 완료! 곽회장님이 접수했습니다. ✦";
  updateProgress();
  setTimeout(() => $("card").classList.add("leaving"), 340);
  setTimeout(() => {
    currentIndex++;
    if (currentIndex >= questions.length) { showResults(); return; }
    renderQuestion();
    $("card").classList.add("entering");
    requestAnimationFrame(() => requestAnimationFrame(() => $("card").classList.remove("entering")));
  }, 500);
}
// 문자열은 textContent로 넣어 안전하게 표시합니다.
function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = text;
  return element;
}
// 문제별 선택 기록을 결과 카드로 정리합니다.
function showResults() {
  showScreen("end");
  $("results").replaceChildren();
  $("summary").textContent = answers.length
    ? `총 ${answers.length}번의 선택 완료. 당신의 선택을 공개합니다!`
    : "등록된 문제가 없습니다. questions 배열에 문제를 추가해 주세요.";
  answers.forEach((answer, index) => {
    const item = questions[answer.questionIndex];
    const card = document.createElement("article");
    card.className = "result";
    card.style.animationDelay = `${index * 50}ms`;
    card.append(
      makeElement("div", "round", `ROUND ${String(index + 1).padStart(2, "0")}`),
      makeElement("h3", "", item.question),
      makeElement("div", "selected-text", `나의 선택: ${answer.choiceIndex + 1}. ${item.choices[answer.choiceIndex]}`)
    );
    const details = [];
    if (item.correctIndex === 0 || item.correctIndex === 1) {
      details.push(answer.choiceIndex === item.correctIndex ? "정답입니다!" : `정답: ${item.choices[item.correctIndex]}`);
    }
    if (item.resultTexts?.[answer.choiceIndex]) details.push(item.resultTexts[answer.choiceIndex]);
    if (details.length) card.append(makeElement("p", "detail", details.join(" ")));
    $("results").append(card);
  });
  $("end-title").focus({preventScroll: true});
  window.scrollTo(0, 0);
}
$("start-button").addEventListener("click", startGame);
$("restart").addEventListener("click", startGame);
buttons.forEach((button, index) => button.addEventListener("click", () => selectChoice(index)));
</script>
</body>
</html>
